name: Windows executable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name StatusWatch run_statuswatch.py
      - name: Test packaged startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process dist/StatusWatch/StatusWatch.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Executable startup failed' }
      - shell: pwsh
        run: |
          Copy-Item .env.example dist/StatusWatch/.env.example
          Copy-Item LEIA_PRIMEIRO.txt dist/StatusWatch/
      - uses: actions/upload-artifact@v4
        with:
          name: StatusWatch-Windows-x64
          path: dist/StatusWatch/
          include-hidden-files: true
